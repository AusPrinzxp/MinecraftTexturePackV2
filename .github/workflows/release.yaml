name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag
        required: true
        default: '1.0.0'
      sounds:
        description: Include TouretteSounds
        default: false
        type: boolean
      textures:
        description: Include TouretteTextures
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          SOUNDS: ${{ inputs.sounds }}
          TEXTURES: ${{ inputs.textures }}
        run: |
          set -euo pipefail

          if [[ "$SOUNDS" != "true" && "$TEXTURES" != "true" ]]; then
            echo "::error::Select at least one release asset."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Version must be a valid release tag without spaces or slashes."
            exit 1
          fi

      - name: Package selected assets
        env:
          VERSION: ${{ inputs.version }}
          SOUNDS: ${{ inputs.sounds }}
          TEXTURES: ${{ inputs.textures }}
        run: |
          set -euo pipefail

          assets=()

          if [[ "$SOUNDS" == "true" ]]; then
            asset="TouretteSounds_${VERSION}.zip"
            (
              cd TouretteSounds
              zip -r "../${asset}" .
            )
            assets+=("$asset")
          fi

          if [[ "$TEXTURES" == "true" ]]; then
            asset="TouretteTextures_${VERSION}.zip"
            (
              cd TouretteTextures
              zip -r "../${asset}" .
            )
            assets+=("$asset")
          fi

          printf '%s\n' "${assets[@]}" > release-assets.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < release-assets.txt
          gh release create "$VERSION" "${assets[@]}" \
            --title "Release $VERSION" \
            --notes "This release contains the latest TouretteTextures and/or TouretteSounds."

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          SOUNDS: ${{ inputs.sounds }}
          TEXTURES: ${{ inputs.textures }}
        run: |
          set -euo pipefail

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured; skipping Discord notifications."
            exit 0
          fi

          send_message() {
            local title="$1"
            local description="$2"
            local payload
            payload="$(jq -n \
              --arg title "$title" \
              --arg description "$description" \
              '{embeds: [{title: $title, description: $description}]}')"

            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$DISCORD_WEBHOOK_URL"
          }

          if [[ "$SOUNDS" == "true" ]]; then
            send_message \
              "New TouretteSounds: $VERSION" \
              "[Download here](https://github.com/$REPOSITORY/releases/download/$VERSION/TouretteSounds_${VERSION}.zip)"
          fi

          if [[ "$TEXTURES" == "true" ]]; then
            send_message \
              "New TouretteTextures: $VERSION" \
              "[Download here](https://github.com/$REPOSITORY/releases/download/$VERSION/TouretteTextures_${VERSION}.zip)"
          fi
